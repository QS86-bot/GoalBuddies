name: CI

# CLAUDE.md, solo-fase: "Tests zijn de enige review die bestaat."
# Zolang er geen tweede paar ogen is, is dit die ogen.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Een nieuwe push op dezelfde branch maakt de vorige run overbodig. Scheelt
# wachttijd en minuten, en de uitkomst van een verouderde commit zegt niets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controle:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Gelijk aan de engines-eis in package.json.
          #
          # ⚠️ **22 en niet 20, en dat was een belofte die de code niet hield.**
          #    `engines` zei `>=20`, maar de realtime-client van supabase-js
          #    vraagt een native `WebSocket` en die bestaat pas vanaf Node 22.
          #    Op 20 valt élke `createClient()` om met "native WebSocket not
          #    found" — geen policyfout, maar wel 29 rode tests.
          #
          #    Lokaal draaide alles op 22, dus dit was hier niet te zien. De
          #    RLS-job in CI vond het meteen.
          node-version: '22'
          cache: npm

      # `npm ci` en niet `npm install`: de lockfile is de waarheid, en een CI die
      # zelf versies mag kiezen test iets anders dan wat er draait.
      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ⚠️ De RLS-tests slaan zichzelf hier over — die draaien in de job
      #    hieronder, tegen een eigen database. Zie `rls`.
      - name: Tests
        run: npm test

      # ⚠️ De Edge-kopie van `shared/time` mag niet uit de pas lopen met die in
      #    `src/`. Twee runtimes betekent twee exemplaren, en dan geldt
      #    correctheidsregel 7 twee keer terwijl niets ze gelijk houdt. Deze
      #    controle draait in Node en heeft geen Deno nodig.
      - name: Edge-tijdmodule gelijk aan die van de app
        run: npm run edge:controle

      # ⚠️ Dode ketens: een functie die niemand aanroept, of een CHECK-waarde die
      #    niemand ooit schrijft. Dat is de vorm die dit project vijf keer duur
      #    betaald heeft — er is niets kapot, dus geen enkele test wordt er rood
      #    van. Zie de kop van het script voor wat hij wél en niet vindt.
      - name: Dode ketens
        run: npm run keten:controle

      # ⚠️ Storage. Vandaag zijn er nul buckets en nul uploads, dus deze stap is
      #    groen omdat er niets ís — precies het groen waar dit project voor
      #    waarschuwt. Hij bestaat voor de dag dat de eerste upload gebouwd wordt:
      #    dán is het een open emmer tenzij iemand eraan denkt, en vanaf nu denkt
      #    de build mee.
      - name: Storage-buckets en hun policies
        run: npm run storage:controle

      # ⚠️ Het manifest tegen `EXPO_PUBLIC_APP_URL`. Verhuist de app ooit van een
      #    eigen subdomein naar een pad, dan moeten `start_url`, `scope`, `id` en
      #    de absolute iconen mee — anders werkt alles behalve de meldingen, en
      #    dat merk je pas als iemand klaagt dat hij niets krijgt.
      - name: Manifest en servicewormer-scope
        run: npm run pwa:controle

      # ⚠️ Een ratel en geen verbod: 27 hand-geschreven `levend`-vlaggen mogen
      #    blijven, er mag er geen bij, en zakt het aantal dan moet het plafond
      #    mee. Die tweede tak is de belangrijkste — een ratel die niet meezakt,
      #    houdt ruimte open voor een kopie die niemand ziet terugkomen.
      - name: Geen nieuwe handmatige levend-vlaggen
        run: npm run levend:controle

  # ---------------------------------------------------------------------------
  # De RLS-suite — QS8-119
  # ---------------------------------------------------------------------------
  #
  # ⚠️ **Hier stond jarenlang niets, en dat was de grootste blinde vlek van deze
  #    pijplijn.** De RLS-suite is de enige plek waar domeinregel 7,
  #    groepslidmaatschap, peer-goedkeuring en het puntengrootboek écht worden
  #    uitgevoerd in plaats van gelezen. Zonder deze job bewees een groen vinkje
  #    op een PR niets over precies die dingen.
  #
  #    Ze konden hier niet draaien omdat ze tegen het echte project praatten en
  #    daar de service-role-key voor nodig hadden — een key die RLS omzeilt geef
  #    je niet aan een runner die op elke push van elke branch draait. Sinds
  #    QS8-119 hoeft dat niet meer: de suite draait tegen een eigen Postgres met
  #    een echte PostgREST ervoor, opgebouwd uit `supabase/migrations/`.
  #
  # ⚠️ **Er zijn hier geen secrets, en dat hoort zo te blijven.** Komt er ooit een
  #    `secrets.` in deze job, dan is de reden daarvoor het opschrijven waard —
  #    want dan draait CI weer tegen iets echts.
  rls:
    name: RLS-policies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Postgres 16, gelijk aan waar het schema tegen gebouwd en vergeleken is.
      # Een andere hoofdversie kan andere `pg_get_functiondef`-uitvoer geven en
      # daarmee een vergelijking die verschil meldt zonder dat er verschil is.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGREST_VERSIE: v12.2.12
      # ⚠️ Vastgepind én op checksum gecontroleerd. Dit is een binary die in CI
      #    draait; hem blind uit een release trekken is een supply-chain-gat dat
      #    je niet ziet tot het misgaat.
      POSTGREST_SHA256: 5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Zie de opmerking bij de job hierboven: 22 is een eis van
          # supabase-js en niet een voorkeur.
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: PostgreSQL-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: PostgREST uit de cache
        id: pgrst-cache
        uses: actions/cache@v4
        with:
          path: ~/postgrest
          key: postgrest-${{ env.POSTGREST_VERSIE }}-${{ env.POSTGREST_SHA256 }}

      - name: PostgREST ophalen
        if: steps.pgrst-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/postgrest
          naam="postgrest-${POSTGREST_VERSIE}-linux-static-x86-64.tar.xz"
          curl -sSL --fail -o "$naam" \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSIE}/${naam}"

          echo "${POSTGREST_SHA256}  ${naam}" | sha256sum --check --strict

          tar xf "$naam" -C ~/postgrest
          ~/postgrest/postgrest --version

      - name: Het schema opbouwen en PostgREST starten
        env:
          POSTGREST_BIN: /home/runner/postgrest/postgrest
        run: scripts/lokale-stack.sh

      # ⚠️ Het register van elke `current_date` in het schema. Hoort hier en niet
      #    in de job hierboven: `pg_get_functiondef()` is de waarheid en een
      #    migratiebestand niet, dus deze controle heeft een opgebouwde database
      #    nodig. Een dertiende `current_date` erbij is geen rode test — er is
      #    niets kapot, er staat alleen een aanname in een grens waar niemand
      #    hem zoekt. Zie de kop van het script.
      - name: Klokgrenzen met een reden
        run: npm run klokgrens:controle

      # ⚠️ Vraagt de app kolommen terug die hij niet mag lezen? Migratie 0089
      #    versmalde de SELECT-grant op `profiles` — terecht — en brak daarmee
      #    stil élke profielopslag, want `updateProfiel()` vroeg zijn rij terug
      #    met `select('*')` en dat is 42501. De policy klopte, de grant klopte,
      #    de app klopte; alleen de combinatie niet. Deze stap legt elke
      #    `select()` in `src/` en `app/` naast de échte grants.
      - name: Kolomrechten tegen wat de app terugvraagt
        run: npm run kolomrechten:controle

      # ⚠️ Deze stap is de eigenlijke poort van dit project. Wat hier groen is,
      #    is bewezen; wat hier niet staat, is niet bewezen.
      - name: RLS-policies
        run: npm run rls:lokaal

      # Zonder dit is een storing in de opstelling niet te onderscheiden van een
      # policyfout, en dan zoek je in de policies naar iets wat een verbinding was.
      - name: PostgREST-log bij een mislukking
        if: failure()
        run: tail -50 "${TMPDIR:-/tmp}/goalbuddies-lokale-stack/pgrst.log" || true

  # ---------------------------------------------------------------------------
  # De Edge Functions — ze draaien op Deno en vielen tot 25-08-2026 buiten alles
  # ---------------------------------------------------------------------------
  #
  # ⚠️ `tsconfig.json` sluit `supabase/functions` uit en `eslint.config.js`
  #    negeert `supabase/*`, want die code is Deno en geen Node. Gevolg: de
  #    rollover en de notificatiejob werden nergens getypecheckt of gelint.
  #
  #    Dat is niet theoretisch gebleven. De `excused`-bevinding van 20-08 bleef
  #    staan omdat de schrijver een Edge Function was en er in `pg_proc` gezocht
  #    werd — wie in de database zoekt, ziet die schrijver niet.
  edge:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ⚠️ `deno check` haalt `jsr:@supabase/supabase-js` op, en `jsr.io` en
      #    `npm.jsr.io` geven 403 op een agent-werkplek. Dat is géén reden om
      #    hier blind te pushen: `registry.npmjs.org` is wél bereikbaar, en het
      #    jsr-pakket is dezelfde broncode als het npm-pakket. Een kopie van deze
      #    map waarin de specifier `npm:@supabase/supabase-js@<zelfde versie>`
      #    wordt, typecheckt daarom volledig op een werkplek — het versienummer
      #    staat in de eerste CI-uitslag. Doe dat vóór je pusht.
      #
      #    Deze stap kostte bij de eerste twee rondes vier fouten, en alle vier
      #    waren ze onzichtbaar in het groen:
      #
      #    1. Er stond hier `supabase/functions/**/*.ts`. De standaardshell van
      #       Actions is bash zónder `globstar`, en dan is `**` gewoon `*`: het
      #       patroon viel uiteen in de drie `*/index.ts`-bestanden en de zeven
      #       modules onder `_shared/` werden nooit gecontroleerd. Een map is
      #       hier het juiste argument — `deno check` loopt er zelf recursief
      #       doorheen, en er valt niets stil weg.
      #    2. Deno vindt de `package.json` van de app als het van hier omhoog
      #       loopt en gaat daarna npm-pakketten in `node_modules` zoeken. Die
      #       staat er in deze job niet, en `npm:@supabase/realtime-js` — een
      #       transitieve afhankelijkheid van de jsr-client — staat er sowieso
      #       niet in. `DENO_NO_PACKAGE_JSON` zet die zoektocht uit: deze map is
      #       een Deno-project en heeft met de Node-afhankelijkheden van de app
      #       niets te maken. Zonder de vlag installeert Deno hier de hele
      #       dependency-boom van de app om drie Edge Functions te typechecken.
      #    3. Achttien typefouten in `notificaties/index.ts`, allemaal uit één
      #       `type Db = ReturnType<typeof createClient>`.
      #    4. Een `db` die in `doelcoach/index.ts` niet bestond — de client heet
      #       daar `alsSysteem`. Dat is geen typefout maar een `ReferenceError`
      #       in de gedéployde functie: élke doelcoach-job liep erop stuk, werd
      #       netjes als `failed` weggeschreven en gaf HTTP 200 terug.
      #
      #    ⚠️ Fout 4 kwam pas boven toen fout 3 weg was — Deno stopt bij de
      #       eerste module die faalt. Eén rode CI-uitslag is dus niet
      #       hetzelfde als één fout.
      - name: Typecheck
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check supabase/functions/

      - name: Lint
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno lint supabase/functions/

    # Zonder deze job is CI een suggestie. Met branch protection op `main` die
  # deze check verplicht stelt, is rood blokkerend — zie docs/Q-TODO.md.
  poort:
    name: Alles groen
    runs-on: ubuntu-latest
    needs: [controle, rls, edge]
    if: always()
    steps:
      - name: Uitslag bepalen
        run: |
          if [ "${{ needs.controle.result }}" != "success" ]; then
            echo "Controle is niet groen: ${{ needs.controle.result }}"
            exit 1
          fi
          if [ "${{ needs.rls.result }}" != "success" ]; then
            echo "De RLS-suite is niet groen: ${{ needs.rls.result }}"
            exit 1
          fi
          # ⚠️ Deze tak hoort bij elke job in `needs`. Zonder hem is een rode job
          #    hierboven decoratief: de poort wacht er wel op maar kijkt niet naar
          #    de uitslag, en dan is CI weer een suggestie.
          if [ "${{ needs.edge.result }}" != "success" ]; then
            echo "De Edge Functions zijn niet groen: ${{ needs.edge.result }}"
            exit 1
          fi
          echo "Groen."
