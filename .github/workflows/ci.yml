name: CI

# CLAUDE.md, solo-fase: "Tests zijn de enige review die bestaat."
# Zolang er geen tweede paar ogen is, is dit die ogen.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # ⚠️ **De wekelijkse run bestaat voor één controle: `audit:controle`** — QS8-191.
  #    Elke andere controle hier meet de repo, en die verandert alleen als iemand
  #    pusht. Kwetsbaarheden niet: de aanleiding voor QS8-191 was géén wijziging
  #    in dit project. `decode-uri-component@0.2.2` zat er al maanden; de advisory
  #    kwam erbij. Een meter die alleen op een push draait, vindt dat pas bij de
  #    volgende push — en dat is hetzelfde "je moet eraan denken" dat dit issue
  #    juist wilde afschaffen, één laag hoger.
  schedule:
    - cron: '17 6 * * 1'

# Een nieuwe push op dezelfde branch maakt de vorige run overbodig. Scheelt
# wachttijd en minuten, en de uitkomst van een verouderde commit zegt niets.
#
# ⚠️⚠️ **Behalve op `main`, en dat is de reparatie van QS8-318.** Daar is elke
#    commit een toestand die uitgerold wordt, en niet een tussenstand die door de
#    volgende push achterhaald raakt. Afbreken betekent dan dat een toestand op
#    `main` nooit een uitslag krijgt — en juist bij snel achter elkaar mergen,
#    precies wanneer twee migraties hetzelfde nummer kunnen dragen.
#
#    📏 Gemeten op 07-09-2026, het venster waarin twee migraties `0182` op `main`
#    landden:
#
#      09:07:34  #259  run 1247  CANCELLED
#      09:07:46  #260  run 1248  CANCELLED   <- de eerste 0182 landt hier
#      09:07:54  #261  run 1249  FAILURE     <- de tweede; main wordt rood
#
#    De controle dééd zijn werk: run 1249 werd rood binnen drie minuten. Maar de
#    run over de commit ertussen is nooit afgerond, en van de 24 main-runs die dag
#    zijn er vijf op deze manier afgebroken. Een uitslag die er niet is, is geen
#    groen en geen rood — hij is er niet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  controle:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Gelijk aan de engines-eis in package.json.
          #
          # ⚠️ **22 en niet 20, en dat was een belofte die de code niet hield.**
          #    `engines` zei `>=20`, maar de realtime-client van supabase-js
          #    vraagt een native `WebSocket` en die bestaat pas vanaf Node 22.
          #    Op 20 valt élke `createClient()` om met "native WebSocket not
          #    found" — geen policyfout, maar wel 29 rode tests.
          #
          #    Lokaal draaide alles op 22, dus dit was hier niet te zien. De
          #    RLS-job in CI vond het meteen.
          node-version: '22'
          cache: npm

      # `npm ci` en niet `npm install`: de lockfile is de waarheid, en een CI die
      # zelf versies mag kiezen test iets anders dan wat er draait.
      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ⚠️ De RLS-tests slaan zichzelf hier over — die draaien in de job
      #    hieronder, tegen een eigen database. Zie `rls`.
      - name: Tests
        run: npm test

      # ⚠️⚠️ **Eén stap, en de lijst komt uit `package.json`** — QS8-417. Hier
      #    stonden twintig stappen met de hand opgesomd, en dat liep de verkeerde
      #    kant op: `scripts/poort.mjs` pikt élke nieuwe `*:controle` vanzelf op,
      #    `ci.yml` niet. 📏 Gemeten op 10-09-2026 stonden er **26 van de 52** niet
      #    in enige workflow — waaronder `schermingang:`, `registerdrift:`,
      #    `exports:` en `hoofdrun:controle`, precies de grendels die dit project
      #    betaald heeft. Een nieuwe grendel stond dus automatisch in de poort (een
      #    commando dat een mens typt) en automatisch niet in CI (dat bij elke push
      #    draait).
      #
      # ⚠️ **De reden per controle staat in de kop van zijn eigen script**, en niet
      #    meer hier. 📏 Alle 26 die hier stonden dragen een kop van tien regels of
      #    meer; twee kopieën van dezelfde uitleg is precies wat `docs:controle`
      #    elders in dit project verbiedt.
      #
      # ⚠️ `set +e`, om dezelfde reden als in de Windows-job: zonder dat breekt de
      #    eerste rode controle de stap af en zie je de rest niet. Eén run hoort
      #    álle bevindingen te tonen, niet de eerste.
      - name: Elke controle die alleen de repo leest
        run: |
          set +e
          mislukt=0
          for naam in $(node scripts/ci-controles.mjs --baan repo); do
            uitvoer="$(npm run --silent "$naam" 2>&1)"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::group::✗ $naam (exit $code)"
              echo "$uitvoer"
              echo "::endgroup::"
              mislukt=1
            else
              echo "✓ $naam"
            fi
          done
          exit $mislukt

  # ---------------------------------------------------------------------------
  # De RLS-suite — QS8-119
  # ---------------------------------------------------------------------------
  #
  # ⚠️ **Hier stond jarenlang niets, en dat was de grootste blinde vlek van deze
  #    pijplijn.** De RLS-suite is de enige plek waar domeinregel 7,
  #    groepslidmaatschap, peer-goedkeuring en het puntengrootboek écht worden
  #    uitgevoerd in plaats van gelezen. Zonder deze job bewees een groen vinkje
  #    op een PR niets over precies die dingen.
  #
  #    Ze konden hier niet draaien omdat ze tegen het echte project praatten en
  #    daar de service-role-key voor nodig hadden — een key die RLS omzeilt geef
  #    je niet aan een runner die op elke push van elke branch draait. Sinds
  #    QS8-119 hoeft dat niet meer: de suite draait tegen een eigen Postgres met
  #    een echte PostgREST ervoor, opgebouwd uit `supabase/migrations/`.
  #
  # ⚠️ **Er zijn hier geen secrets, en dat hoort zo te blijven.** Komt er ooit een
  #    `secrets.` in deze job, dan is de reden daarvoor het opschrijven waard —
  #    want dan draait CI weer tegen iets echts.
  rls:
    name: RLS-policies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Postgres 16, gelijk aan waar het schema tegen gebouwd en vergeleken is.
      # Een andere hoofdversie kan andere `pg_get_functiondef`-uitvoer geven en
      # daarmee een vergelijking die verschil meldt zonder dat er verschil is.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGREST_VERSIE: v12.2.12
      # ⚠️ Vastgepind én op checksum gecontroleerd. Dit is een binary die in CI
      #    draait; hem blind uit een release trekken is een supply-chain-gat dat
      #    je niet ziet tot het misgaat.
      POSTGREST_SHA256: 5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Zie de opmerking bij de job hierboven: 22 is een eis van
          # supabase-js en niet een voorkeur.
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: PostgreSQL-client
        run: |
          # ⚠️⚠️ **Het verversen is best-effort, de installatie niet** — QS8-400.
          #    `apt-get update` ververst élke bron die op de runnerimage staat,
          #    ook die van derden waar deze CI niets van nodig heeft, en eindigt
          #    met exitcode 100 zodra er één inconsistent is. Dan staat `main`
          #    rood om iets dat niet in deze repo zit, en dat is duur: een
          #    herstart, plus het vertrouwen in elke volgende rode uitslag.
          #
          # 📏 Gemeten op 09-09-2026 na de merge van #356. `dl.google.com` gaf
          #    een `Packages.gz` van 09:41 bij een `Release` van 17:16 —
          #    "Hash Sum mismatch" — en dat bleef bij een herstart bytegelijk
          #    hetzelfde. Het was dus geen tijdelijke hapering maar een mirror
          #    die zo stond; wachten had niet geholpen.
          #
          # ⚠️ **Dit is geen weggemoffelde fout.** APT zegt zelf "they have been
          #    ignored, or old ones used instead" en gaat door. De vraag die
          #    ertoe doet is of het pakket er kómt, en die wordt één regel lager
          #    gesteld — `install` faalt hard, zonder `|| true`. Wat hier wordt
          #    losgelaten is uitsluitend de eis dat élke bron ververst is.
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: PostgREST uit de cache
        id: pgrst-cache
        uses: actions/cache@v4
        with:
          path: ~/postgrest
          key: postgrest-${{ env.POSTGREST_VERSIE }}-${{ env.POSTGREST_SHA256 }}

      - name: PostgREST ophalen
        if: steps.pgrst-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/postgrest
          naam="postgrest-${POSTGREST_VERSIE}-linux-static-x86-64.tar.xz"
          curl -sSL --fail -o "$naam" \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSIE}/${naam}"

          echo "${POSTGREST_SHA256}  ${naam}" | sha256sum --check --strict

          tar xf "$naam" -C ~/postgrest
          ~/postgrest/postgrest --version

      - name: Het schema opbouwen en PostgREST starten
        env:
          POSTGREST_BIN: /home/runner/postgrest/postgrest
        run: scripts/lokale-stack.sh

      # ⚠️ Deze stap is de eigenlijke poort van dit project. Wat hier groen is,
      #    is bewezen; wat hier niet staat, is niet bewezen.
      - name: RLS-policies
        run: npm run rls:lokaal

      # ⚠️⚠️ **Dezelfde lijst-uit-`package.json` als in de job hierboven**
      #    (QS8-417), maar dan de baan die een opgebouwde database nodig heeft:
      #    `HEEFT_DATABASE_NODIG` in `scripts/poort.mjs` is de bron, zodat de
      #    poort en CI dezelfde indeling gebruiken en niet twee kunnen krijgen.
      #
      # ⚠️ **Ná `rls:lokaal` en niet ervoor.** Valt hier iets om, dan weet je dat
      #    de suite daarvóór wél gemeten heeft. `idempotent:controle` zit in deze
      #    baan en bouwt een éígen database (`goalbuddies_dubbel`); hij laat de
      #    stack met rust, maar de volgorde houdt de uitslagen uit elkaar.
      - name: Elke controle die de database nodig heeft
        run: |
          set +e
          mislukt=0
          for naam in $(node scripts/ci-controles.mjs --baan database); do
            uitvoer="$(npm run --silent "$naam" 2>&1)"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::group::✗ $naam (exit $code)"
              echo "$uitvoer"
              echo "::endgroup::"
              mislukt=1
            else
              echo "✓ $naam"
            fi
          done
          exit $mislukt

      # Zonder dit is een storing in de opstelling niet te onderscheiden van een
      # policyfout, en dan zoek je in de policies naar iets wat een verbinding was.
      - name: PostgREST-log bij een mislukking
        if: failure()
        run: tail -50 "${TMPDIR:-/tmp}/goalbuddies-lokale-stack/pgrst.log" || true

  # ---------------------------------------------------------------------------
  # De Edge Functions — ze draaien op Deno en vielen tot 25-08-2026 buiten alles
  # ---------------------------------------------------------------------------
  #
  # ⚠️ `tsconfig.json` sluit `supabase/functions` uit, want die code is Deno en
  #    geen Node — daarvoor is deze job er. Gevolg tot 25-08: de rollover en de
  #    notificatiejob werden nergens getypecheckt of gelint.
  #
  #    Dat is niet theoretisch gebleven. De `excused`-bevinding van 20-08 bleef
  #    staan omdat de schrijver een Edge Function was en er in `pg_proc` gezocht
  #    werd — wie in de database zoekt, ziet die schrijver niet.
  #
  # ⚠️ **`eslint.config.js` negeert deze map sinds 11-09-2026 níét meer**
  #    (QS8-422): `max-depth`, `no-shadow` en de ratel van coderegel 15 gelden er
  #    via `npm run lint` in de job hierboven. Deze job blijft nodig en overlapt
  #    daar niet mee — `deno check` is de énige typecontrole die deze map ziet,
  #    en `deno lint` kent Deno-eigen regels die ESLint niet heeft. Andersom kent
  #    `deno lint` geen complexiteitsregels, en dát was het gat.
  edge:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ⚠️ `deno check` haalt `jsr:@supabase/supabase-js` op, en `jsr.io` en
      #    `npm.jsr.io` geven 403 op een agent-werkplek. Dat is géén reden om
      #    hier blind te pushen: `registry.npmjs.org` is wél bereikbaar, en het
      #    jsr-pakket is dezelfde broncode als het npm-pakket. Een kopie van deze
      #    map waarin de specifier `npm:@supabase/supabase-js@<zelfde versie>`
      #    wordt, typecheckt daarom volledig op een werkplek.
      #
      #    ⚠️ **Sinds QS8-214 hoef je dat niet meer met de hand te doen:**
      #    `npm run edge:types:controle` maakt die kopie, herschrijft precies
      #    die ene specifier en draait check én lint met dezelfde vlag als
      #    hieronder. Hij draait mee in `npm run poort`. Zonder Deno meldt hij
      #    OVERGESLAGEN en telt de poort hem als ongemeten — niet als groen.
      #
      #    Deze stap kostte bij de eerste twee rondes vier fouten, en alle vier
      #    waren ze onzichtbaar in het groen:
      #
      #    1. Er stond hier `supabase/functions/**/*.ts`. De standaardshell van
      #       Actions is bash zónder `globstar`, en dan is `**` gewoon `*`: het
      #       patroon viel uiteen in de drie `*/index.ts`-bestanden en de zeven
      #       modules onder `_shared/` werden nooit gecontroleerd. Een map is
      #       hier het juiste argument — `deno check` loopt er zelf recursief
      #       doorheen, en er valt niets stil weg.
      #    2. Deno vindt de `package.json` van de app als het van hier omhoog
      #       loopt en gaat daarna npm-pakketten in `node_modules` zoeken. Die
      #       staat er in deze job niet, en `npm:@supabase/realtime-js` — een
      #       transitieve afhankelijkheid van de jsr-client — staat er sowieso
      #       niet in. `DENO_NO_PACKAGE_JSON` zet die zoektocht uit: deze map is
      #       een Deno-project en heeft met de Node-afhankelijkheden van de app
      #       niets te maken. Zonder de vlag installeert Deno hier de hele
      #       dependency-boom van de app om drie Edge Functions te typechecken.
      #    3. Achttien typefouten in `notificaties/index.ts`, allemaal uit één
      #       `type Db = ReturnType<typeof createClient>`.
      #    4. Een `db` die in `doelcoach/index.ts` niet bestond — de client heet
      #       daar `alsSysteem`. Dat is geen typefout maar een `ReferenceError`
      #       in de gedéployde functie: élke doelcoach-job liep erop stuk, werd
      #       netjes als `failed` weggeschreven en gaf HTTP 200 terug.
      #
      #    ⚠️ Fout 4 kwam pas boven toen fout 3 weg was — Deno stopt bij de
      #       eerste module die faalt. Eén rode CI-uitslag is dus niet
      #       hetzelfde als één fout.
      - name: Typecheck
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check supabase/functions/

      - name: Lint
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno lint supabase/functions/

    # Zonder deze job is CI een suggestie. Met branch protection op `main` die
  # deze check verplicht stelt, is rood blokkerend — zie docs/Q-TODO.md.
  # ---------------------------------------------------------------------------
  # De scripts op Windows
  # ---------------------------------------------------------------------------
  #
  # ⚠️ **Waarom deze job bestaat.** Alles onder `scripts/` draait op de machine
  #    van de ontwikkelaar en niet in CI, en die machine is Windows. Groene CI
  #    bewees voor die bestanden dus alleen dat ze op Linux werken.
  #
  #    Op 26-08-2026 kostte dat achttien bestanden. Acht gebruikten
  #    ``import.meta.url === `file://${process.argv[1]}` `` als main-guard; op
  #    Windows is `import.meta.url` gelijk aan `file:///C:/Users/…` en
  #    `process.argv[1]` aan `C:\Users\…`, dus die vergelijking is nóóit waar
  #    en `main()` draaide niet. Exit 0, geen uitvoer — en een controle die
  #    niets zegt, leest als een controle die niets gevonden heeft. Tien andere
  #    bouwden hun wortelpad met `new URL(...).pathname`, dat op Windows
  #    `/C:/Users/…` geeft en op élk platform de URL-codering vasthoudt.
  #
  # ⚠️ **`tests/scripts/padvormen.test.ts` leest de vorm; deze job draait hem.**
  #    Dat onderscheid is het hele punt. De test vindt de twee bekende vormen
  #    terug in de broncode en kan op Linux draaien, maar hij kan niet zien of
  #    een script daadwerkelijk start — en de volgende platformval heeft een
  #    andere vorm dan deze twee. Alleen een echte Windows-runner bewijst het
  #    gedrag.
  #
  # ⚠️ **Geen uitvoer is hier de fout, niet alleen een rode exitcode.** Precies
  #    dat was de faalvorm: het script deed niets en meldde succes. Vandaar dat
  #    de lus hieronder op een lege uitvoer valt en niet alleen op `$?`.
  #
  # ⚠️ Rechtstreeks met `node` en niet via `npm run`, want `npm` drukt zelf al
  #    een bannerregel af. Via `npm run` is de uitvoer nooit leeg en toetst deze
  #    stap niets.
  #
  # ⚠️ Alleen de controles die zonder database en zonder credentials draaien.
  #    `klokgrens`, `kolomrechten` en `pin` vragen de lokale stack — die staat in
  #    de `rls`-job en die is Linux. Dit is dus geen volledige dekking en dat
  #    hoort hier te staan: het bewijst dat een script stárt op Windows, niet dat
  #    élk script dat doet.
  #
  # ⚠️ **Wat dit kost.** Een Windows-runner telt bij GitHub voor **2×** de
  #    minuten van een Linux-runner. Zolang deze repo openbaar is, is dat gratis.
  #    Gaat hij dicht (QS8-126), dan is dit de duurste job van de vier terwijl
  #    het de kortste is — geen build, geen database, alleen `npm ci` en dertien
  #    scripts. Wordt dat ooit een probleem, dan is de goedkope versnelling deze
  #    job beperken tot pushes op `main` en tot PR's die `scripts/` raken; niet
  #    hem weghalen, want dan is de blinde vlek terug.
  scripts_windows:
    name: Scripts op Windows
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        # Git Bash staat op elke Windows-runner. Node blijft een Windows-binary,
        # dus `process.argv[1]` is nog steeds een pad met een stationsletter —
        # de val die deze job moet vangen, blijft er dus in zitten.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: De vormcontrole zelf
        run: npx vitest run tests/scripts/padvormen.test.ts

      - name: Elke controle start en zegt iets
        run: |
          # ⚠️ Actions draait `shell: bash` met `-eo pipefail`. Zonder `set +e`
          #    breekt het eerste script dat niet-nul teruggeeft de hele stap af,
          #    en dan is de lege-uitvoercontrole hieronder nooit aan de beurt —
          #    precies het geval dat deze job moet vangen.
          set +e
          mislukt=0
          for script in \
            audit-controle \
            docs-controle \
            dode-keten-controle \
            edge-tijd-controle \
            emoji-controle \
            levend-controle \
            migratieregister-controle \
            migraties-controle \
            persoon-in-jsonb-controle \
            pwa-controle \
            review-controle \
            storage-controle \
            tekst-controle \
            verbindingen-controle
          do
            uitvoer="$(node "scripts/$script.mjs" 2>&1)"
            code=$?
            if [ -z "$uitvoer" ]; then
              echo "✗ $script gaf geen uitvoer (exit $code) — main() is niet gedraaid."
              mislukt=1
            elif [ "$code" -ne 0 ]; then
              echo "✗ $script gaf exit $code:"
              echo "$uitvoer"
              mislukt=1
            else
              echo "✓ $script"
            fi
          done
          exit $mislukt

      # ⚠️ Apart, want zonder `.env` hoort deze juist te klágen. De vraag is niet
      #    of hij slaagt maar of hij überhaupt aan het woord komt: vóór 26-08
      #    eindigde `npm run deploy` op Windows stil met exit 0, en dat is een
      #    deploy die zegt dat hij gelukt is terwijl er niets gebeurd is.
      # ⚠️ **Apart van de lus hierboven**, want dit script heet niet `*-controle.mjs`
      #    en het duurt langer: het kopieert de functiemap en draait `deno check`
      #    plus `deno lint`.
      #
      #    ⚠️⚠️ **En het staat hier omdat het op Windows twee keer stil kon
      #    zwijgen** (QS8-214, nawerk 07-09): `find` is er een tekstzoeker en geen
      #    bestandszoeker, en npm zet er `deno.cmd` neer in plaats van `deno`. In
      #    beide gevallen mat de controle niets op precies de machine waar hij met
      #    de hand gedraaid wordt. Die twee reparaties zijn een redenering zolang
      #    er geen Windows onder staat — deze stap maakt er een meting van.
      #
      #    ⚠️⚠️ **En hier moet OVERGESLAGEN rood zijn.** Het script exit 0 als het
      #    geen Deno vindt — terecht, want in de poort telt die regel als
      #    ongemeten. Maar deze stap bestáát om te meten dat het op Windows
      #    wérkt, en dan is "ik kon niet meten" precies de uitslag die hier niet
      #    door mag. Zonder deze eis zou een teruggedraaide reparatie hier weer
      #    groen worden.
      - name: De Edge-typecheck draait ook op Windows
        run: |
          set +e
          uitvoer="$(npm run edge:types:controle 2>&1)"
          code=$?
          echo "$uitvoer"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if echo "$uitvoer" | grep -q "OVERGESLAGEN"; then
            echo "✗ De controle sloeg zichzelf over. Deze stap bestaat om te meten"
            echo "  dat hij op Windows draait; overgeslagen is hier geen groen."
            exit 1
          fi

      - name: De deploy komt aan het woord
        # ⚠️ `always()`, want anders verbergt één fout de andere. In de eerste
        #    echte run viel de stap hierboven om op `tekst-controle` en werd deze
        #    overgeslagen — en dan weet je na een rode job nog steeds niet of de
        #    deploy op Windows aan het woord komt. Bij een controle die juist de
        #    stille gevallen moet vinden, is dat het verkeerde gedrag.
        if: always()
        run: |
          set +e
          uitvoer="$(node scripts/deploy-web.mjs --droog 2>&1)"
          if [ -z "$uitvoer" ]; then
            echo "✗ deploy-web gaf geen uitvoer — main() is niet gedraaid."
            exit 1
          fi
          echo "$uitvoer"

  poort:
    name: Alles groen
    runs-on: ubuntu-latest
    needs: [controle, rls, edge, scripts_windows]
    if: always()
    steps:
      - name: Uitslag bepalen
        run: |
          if [ "${{ needs.controle.result }}" != "success" ]; then
            echo "Controle is niet groen: ${{ needs.controle.result }}"
            exit 1
          fi
          if [ "${{ needs.rls.result }}" != "success" ]; then
            echo "De RLS-suite is niet groen: ${{ needs.rls.result }}"
            exit 1
          fi
          # ⚠️ Deze tak hoort bij elke job in `needs`. Zonder hem is een rode job
          #    hierboven decoratief: de poort wacht er wel op maar kijkt niet naar
          #    de uitslag, en dan is CI weer een suggestie.
          if [ "${{ needs.edge.result }}" != "success" ]; then
            echo "De Edge Functions zijn niet groen: ${{ needs.edge.result }}"
            exit 1
          fi
          if [ "${{ needs.scripts_windows.result }}" != "success" ]; then
            echo "De scripts draaien niet op Windows: ${{ needs.scripts_windows.result }}"
            exit 1
          fi
          echo "Groen."
